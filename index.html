<!DOCTYPE html>
<html lang="en" data-mode="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inferuno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0..1,0&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bar">
        <nav class="island nav">
            <!-- Sliding pill for nav bar, positioned by script.js -->
            <span class="nav-thumb"></span>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#board">Board</a>
        </nav>
        <div class="island controls">
            <button class="icon-btn" type="button" id="mode" aria-label="Switch to light mode">
                <span class="material-symbols-rounded">dark_mode</span>
            </button>
            <button class="icon-btn" type="button" id="play" aria-label="Play">
                <span class="material-symbols-rounded">play_arrow</span>
            </button>
        </div>
    </header>
    <main>
        <!-- Each hue is for the color shift. -->
        <section id="about" data-hue="20">
            <h1>Inferuno</h1>
        </section>
        <section id="projects" data-hue="150">
            <h2>Projects</h2>
        </section>
        <section id="board" data-hue="260">
            <h2>Board</h2>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
